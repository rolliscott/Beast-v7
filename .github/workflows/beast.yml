name: Delphian v9.0 BEAST TANK - SAVE COIN 6:30-21:30 Lagos
on:
  schedule:
    - cron: '*/10 5-20 * * *'  # Every 10 min, 06:00-21:59 Lagos (covers your 6:30-21:30)
  workflow_dispatch:
jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python main.py
      - run: |
          git config user.email "bot@beast.tank"
          git config user.name "Beast Tank Bot"
          # SAVE COIN: Push only when GHOST signal
          if grep -q "GHOST SHORT\|GHOST LONG" status.json; then
            echo "🚨 GHOST FOUND - PUSHING"
            git add status.json candles.json || true
            git diff --quiet && git diff --staged --quiet || git commit -m "🚨 GHOST $(date) - save coin"
            git push
          else
            echo "💤 WAIT 0% - NO PUSH - SAVE COIN 6:30-21:30"
          fi
